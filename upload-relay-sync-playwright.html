<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Upload relay synchronization fixture</title></head>
<body><div id="app"></div><script type="module">
if (new URLSearchParams(location.search).has("host")) {
    const url = new URL(location.href); url.searchParams.delete("host");
    const iframe = document.createElement("iframe");
    iframe.title = "Upload settings"; iframe.src = url.href;
    iframe.style.cssText = "border:0;width:100%;height:950px";
    document.body.style.margin = "0"; document.body.replaceChildren(iframe);
} else await import("/src/test/e2e/uploadRelaySyncHarness.ts");
</script></body>
</html>

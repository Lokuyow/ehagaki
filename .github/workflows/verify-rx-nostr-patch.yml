name: Verify rx-nostr dependency patch

on:
  pull_request:
  push:
    branches: [feature/nip65-outbox-routing]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install project npm
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: npm run verify:rx-nostr-patch
      - run: npm run test -- src/test/unit/rxNostrSendIsolation.test.ts

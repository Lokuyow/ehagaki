name: Test reliability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-reliability-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vitest-shards:
    name: Vitest shard ${{ matrix.shard }}/2 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # PR feedback uses one OS; main/manual runs retain platform coverage.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    outputs:
      linux_1: ${{ steps.metrics.outputs.linux_1 }}
      linux_2: ${{ steps.metrics.outputs.linux_2 }}
      windows_1: ${{ steps.metrics.outputs.windows_1 }}
      windows_2: ${{ steps.metrics.outputs.windows_2 }}
      linux_1_result: ${{ runner.os == 'Linux' && matrix.shard == 1 && job.status || '' }}
      linux_2_result: ${{ runner.os == 'Linux' && matrix.shard == 2 && job.status || '' }}
      windows_1_result: ${{ runner.os == 'Windows' && matrix.shard == 1 && job.status || '' }}
      windows_2_result: ${{ runner.os == 'Windows' && matrix.shard == 2 && job.status || '' }}
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install project npm
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - name: Record Linux runner CPU
        if: runner.os == 'Linux'
        shell: bash
        run: |
          printf 'Logical CPUs: %s\n' "$(nproc)"
          LC_ALL=C lscpu | sed -n '/^Model name:/p'
      - name: Record Windows runner CPU
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors | Format-List
      - name: Stabilize Vitest patch metadata
        if: vars.VITEST_FS_CACHE != 'off'
        env:
          PATCHES_HASH: ${{ hashFiles('patches/**') }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { utimesSync } from 'node:fs';
          const hash = process.env.PATCHES_HASH;
          if (!/^[a-f0-9]{64}$/.test(hash || '')) throw new Error('Missing patch content hash');
          // Content-derived seconds are stable even with a shallow checkout.
          const seconds = 946684800 + Number.parseInt(hash.slice(0, 8), 16) % 31536000;
          utimesSync('patches', seconds, seconds);
          NODE
      - name: Restore Vitest module cache
        if: vars.VITEST_FS_CACHE != 'off'
        id: vitest-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vitest-fs-cache
          key: vitest-fs-v1-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('package.json', 'package-lock.json', 'patches/**', 'vitest.config.ts', 'svelte.config.js', 'tsconfig*.json', '.node-version', '.github/workflows/test-reliability.yml') }}
      - name: Discard a missed or failed cache restore
        if: vars.VITEST_FS_CACHE != 'off' && steps.vitest-cache.outputs.cache-hit != 'true'
        env:
          VITEST_FS_CACHE_PATH: ${{ runner.temp }}/vitest-fs-cache
        shell: bash
        run: node --input-type=module -e "import { rmSync } from 'node:fs'; rmSync(process.env.VITEST_FS_CACHE_PATH, { recursive:true, force:true });"
      - name: List complete Vitest file inventory
        if: matrix.shard == 1
        env:
          VITEST_ALL_FILES_PATH: ${{ runner.temp }}/vitest-all-files.json
        shell: bash
        run: |
          set -o pipefail
          npx vitest list --filesOnly --json="$VITEST_ALL_FILES_PATH" 2>&1 | node scripts/filterTestOutput.mjs
      - name: Run Vitest with sanitized output
        env:
          VITEST_SHARD_METRICS_PATH: ${{ runner.temp }}/vitest-shard-metrics.json
          VITEST_FS_CACHE_PATH: ${{ runner.temp }}/vitest-fs-cache
        shell: bash
        run: |
          set -o pipefail
          npm test -- --shard="$SHARD/2" --pool=threads --fsModuleCachePath="$VITEST_FS_CACHE_PATH" --reporter=default --reporter=./scripts/vitestShardMetrics.mjs 2>&1 | node scripts/filterTestOutput.mjs
      - name: Publish validated shard metrics
        id: metrics
        env:
          VITEST_SHARD_METRICS_PATH: ${{ runner.temp }}/vitest-shard-metrics.json
          VITEST_ALL_FILES_PATH: ${{ runner.temp }}/vitest-all-files.json
        shell: bash
        run: node scripts/vitestShardMetrics.mjs publish "$RUNNER_OS" "$SHARD"
      - name: Save Vitest module cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VITEST_FS_CACHE != 'off' && steps.vitest-cache.outputs.cache-hit != 'true' && steps.vitest-cache.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vitest-fs-cache
          key: ${{ steps.vitest-cache.outputs.cache-primary-key }}

  vitest:
    name: Vitest (${{ matrix.os }})
    needs: [vitest-shards]
    if: always()
    strategy:
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","key":"linux","runtime":"Linux"}]' || '[{"os":"ubuntu-latest","key":"linux","runtime":"Linux"},{"os":"windows-latest","key":"windows","runtime":"Windows"}]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify both shards and complete file coverage
        env:
          VITEST_SHARD_1: ${{ needs.vitest-shards.outputs[format('{0}_1', matrix.key)] }}
          VITEST_SHARD_2: ${{ needs.vitest-shards.outputs[format('{0}_2', matrix.key)] }}
          VITEST_SHARD_1_RESULT: ${{ needs.vitest-shards.outputs[format('{0}_1_result', matrix.key)] }}
          VITEST_SHARD_2_RESULT: ${{ needs.vitest-shards.outputs[format('{0}_2_result', matrix.key)] }}
          VITEST_OS: ${{ matrix.runtime }}
        shell: bash
        run: node scripts/vitestShardMetrics.mjs aggregate "$VITEST_OS"

  check-and-build:
    name: Check and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Match Vitest's platform coverage for each trigger.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install project npm
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: npm run check
      - run: npm run build

name: Test reliability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-reliability-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-and-build:
    name: Vitest, check, and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # PR feedback uses one OS; main/manual runs retain platform coverage.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install project npm
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - name: Record Linux runner CPU
        if: runner.os == 'Linux'
        shell: bash
        run: |
          printf 'Logical CPUs: %s\n' "$(nproc)"
          LC_ALL=C lscpu | sed -n '/^Model name:/p'
      - name: Record Windows runner CPU
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors | Format-List
      - name: Run Vitest with sanitized output
        shell: bash
        run: |
          set -o pipefail
          npm test -- --reporter=default --reporter=./scripts/vitestMetricsReporter.mjs 2>&1 | node scripts/filterTestOutput.mjs
      - run: npm run check
      - run: npm run build

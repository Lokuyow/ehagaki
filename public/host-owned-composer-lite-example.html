<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Host-owned Composer Lite example</title>
  <style>body { font: 16px system-ui; margin: 2rem auto; max-width: 760px; padding: 0 1rem; } ehagaki-composer { display:block; height:460px; border:1px solid #bbb; }</style>
  <h1>Host-owned Composer Lite</h1>
  <p>This page imports only the Lite distribution and explicitly uses its own asset base.</p>
  <script type="module">
    await import('./web-component/host-owned/ehagaki-composer.js');
    const composer = document.createElement('ehagaki-composer');
    composer.id = 'composer';
    composer.assetBase = new URL('./web-component/host-owned/', import.meta.url).href;
    composer.configureHostOwned({
      submit(output) {
        document.querySelector('#status').textContent = `submit: ${output.content}`;
      },
      uploadMedia(file) { return { url: `https://example.invalid/media/${encodeURIComponent(file.name)}` }; },
    });
    composer.setCustomEmojis([{ shortcode: 'wave', url: 'https://example.invalid/emoji/wave.webp' }]);
    document.body.append(composer);
    await composer.whenReady();
    document.querySelector('#status').textContent = 'ready';
  </script>
  <p id="status" role="status">loading</p>
</html>
